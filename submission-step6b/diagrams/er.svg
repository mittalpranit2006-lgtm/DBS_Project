<text x="70" y="1200" font-family="Arial" font-size="18" fill="#12304a">1:N  CUSTOMER→CUSTOMER_PHONE; CUSTOMER→RENTAL; VEHICLE_TYPE→VEHICLE; BRANCH→VEHICLE/EMPLOYEE</text>
<text x="70" y="1230" font-family="Arial" font-size="18" fill="#12304a">1:N  VEHICLE→RENTAL; EMPLOYEE→RENTAL; RENTAL→PAYMENT. Child foreign keys are mandatory.</text>
